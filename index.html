<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oct Bot — Legal</title>
  <meta name="description" content="Terms of Service and Privacy Policy for Oct Bot, a Discord bot.">
  <style>
    :root { color-scheme: dark; --bg:#101114; --panel:#1b191f; --text:#f3f0f6; --muted:#b6b0bc; --accent:#b6a0ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; background:radial-gradient(ellipse at top,#292332,transparent 55%),var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(720px,100%); border:1px solid #393440; background:var(--panel); border-radius:22px; padding:clamp(24px,5vw,48px); box-shadow:0 18px 60px #0005; }
    .mark { width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#302843;color:var(--accent);font-weight:800;font-size:20px; }
    h1 { margin:20px 0 8px; letter-spacing:-.04em; font-size:clamp(30px,5vw,42px); }
    p { color:var(--muted); margin:0 0 24px; }
    .links { display:grid; gap:12px; }
    a { display:flex;justify-content:space-between;align-items:center;gap:16px;text-decoration:none;color:var(--text);padding:18px 20px;border:1px solid #3a3542;border-radius:14px;background:#222027;transition:border-color .15s,transform .15s; }
    a:hover { border-color:var(--accent); transform:translateY(-1px); }
    a span { color:var(--muted); }
    footer { margin-top:28px;font-size:13px;color:#8f8997; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="Oct Bot">O</div>
    <h1>Oct Bot</h1>
    <p>Helpful tools and features for your Discord community. Review our policies below.</p>
    <div class="links">
      <a href="TERMS_OF_SERVICE.md">Terms of Service <span>↗</span></a>
      <a href="PRIVACY_POLICY.md">Privacy Policy <span>↗</span></a>
    </div>
    <footer>Oct Bot · Legal &amp; Policies</footer>
  </main>
</body>
</html>
